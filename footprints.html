<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留言板 - 我的博客</title>
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main">
      <h1 style="text-align:center">留言板</h1>
      <div class="fp-grid" id="footprint-list"></div>

      <div class="form-box">
        <h3>写留言</h3>
        <div class="form-group">
          <label>头像（可选）</label>
          <input type="file" id="fp-avatar" accept="image/*" style="font-size:0.85rem">
        </div>
        <div class="form-group">
          <input type="text" id="fp-username" class="input" placeholder="你的昵称" maxlength="30">
        </div>
        <div class="form-group">
          <label>昵称颜色</label>
          <div class="color-picker" id="color-picker">
            <button type="button" class="color-btn active" data-color="#58a6ff" style="background:#58a6ff"></button>
            <button type="button" class="color-btn" data-color="#3fb950" style="background:#3fb950"></button>
            <button type="button" class="color-btn" data-color="#d29922" style="background:#d29922"></button>
            <button type="button" class="color-btn" data-color="#ff7b72" style="background:#ff7b72"></button>
            <button type="button" class="color-btn" data-color="#bc8cff" style="background:#bc8cff"></button>
            <button type="button" class="color-btn" data-color="#39c5cf" style="background:#39c5cf"></button>
            <button type="button" class="color-btn" data-color="#f778ba" style="background:#f778ba"></button>
          </div>
        </div>
        <div class="form-group">
          <textarea id="fp-message" class="input" placeholder="说点什么..." maxlength="500" rows="3"></textarea>
        </div>
        <div id="fp-msg"></div>
        <button class="btn btn-primary" id="fp-submit">发表留言</button>
      </div>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/demo-data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/effects.js"></script>
  <script src="assets/rain.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var listEl = document.getElementById("footprint-list");
      var avEl = document.getElementById("fp-avatar");
      var nameEl = document.getElementById("fp-username");
      var msgEl = document.getElementById("fp-message");
      var submit = document.getElementById("fp-submit");
      var out = document.getElementById("fp-msg");
      var color = "#58a6ff";

      function render() {
        listEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem 0;grid-column:1/-1">加载中…</p>';
        DB.getFootprints().then(function (list) {
          if (!list.length) {
            listEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem 0;grid-column:1/-1">还没有留言，来写第一条吧。</p>';
            return;
          }
          listEl.innerHTML = list.map(function (f) {
            var ava = f.avatar
              ? '<img src="' + DB.esc(f.avatar) + '" alt="">'
              : '<div class="fp-ava">' + DB.esc((f.name || "?")[0]) + '</div>';
            return '<div class="fp-card">' + ava +
              '<div class="fp-name" style="color:' + DB.esc(f.color || "#58a6ff") + '">' + DB.esc(f.name) + '</div>' +
              '<p class="fp-msg">' + DB.esc(f.text) + '</p>' +
            '</div>';
          }).join("");
          if (window.initReveal) window.initReveal();
        }).catch(function (e) {
          listEl.innerHTML = '<p style="color:var(--danger);text-align:center;padding:2rem 0;grid-column:1/-1">加载失败：' + DB.esc(e.message) + '</p>';
        });
      }

      document.getElementById("color-picker").addEventListener("click", function (e) {
        var b = e.target.closest(".color-btn");
        if (!b) return;
        document.querySelectorAll(".color-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        color = b.dataset.color;
      });

      // 把选中图片缩到 96px 以内，压成 JPEG data URL，体积可控
      function shrinkImage(file, cb) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var max = 96;
            var w = img.width, h = img.height;
            if (w > h) { if (w > max) { h = h * max / w; w = max; } }
            else { if (h > max) { w = w * max / h; h = max; } }
            var c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(w));
            c.height = Math.max(1, Math.round(h));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            try { cb(c.toDataURL("image/jpeg", 0.8)); } catch (e) { cb(""); }
          };
          img.onerror = function () { cb(""); };
          img.src = reader.result;
        };
        reader.onerror = function () { cb(""); };
        reader.readAsDataURL(file);
      }

      submit.addEventListener("click", function () {
        var name = nameEl.value.trim();
        var msg = msgEl.value.trim();
        if (!name || !msg) {
          out.className = "form-msg err";
          out.textContent = "请填写昵称和留言";
          return;
        }
        out.className = "form-msg";
        out.textContent = "发送中…";
        submit.disabled = true;

        function send(avatar) {
          DB.addFootprint({ name: name, text: msg, color: color, avatar: avatar || "" })
            .then(function () {
              nameEl.value = ""; msgEl.value = ""; avEl.value = "";
              out.className = "form-msg ok";
              out.textContent = "留言成功！";
              render();
            })
            .catch(function (e) {
              out.className = "form-msg err";
              out.textContent = e.message || "留言失败";
            })
            .then(function () { submit.disabled = false; });
        }

        var file = avEl.files && avEl.files[0];
        if (file) { shrinkImage(file, send); } else { send(""); }
      });

      render();
    });
  </script>
</body>
</html>
